<style>
/* Layout: home = brand + corner flags + colour tiles. Feed = snap-scrolling pairs: bold fact card, then a 2x2 grid of colour answer tiles. */
:root{
  --bg:#F1EEFA; --surface:#FFFFFF; --fg:#1B1530; --muted:#6A6286; --line:#DCD6EE;
  --accent:#5B3DF5; --on-accent:#FFFFFF;
  --good:#0F7A43; --bad:#B3261E;
  --a:oklch(.58 .21 25); --b:oklch(.5 .2 265); --c:oklch(.8 .17 85); --d:oklch(.52 .14 165);

  --f-display:"Bricolage Grotesque","SF Pro Rounded","Avenir Next",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree","SF Pro Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120E24; --surface:#1D1838; --fg:#F2EFFF; --muted:#A39BC6; --line:#32295A;
  --accent:#9B87FF; --on-accent:#120E24; --good:#6EE7A8; --bad:#FF9A92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120E24; --surface:#1D1838; --fg:#F2EFFF; --muted:#A39BC6; --line:#32295A;
  --accent:#9B87FF; --on-accent:#120E24; --good:#6EE7A8; --bad:#FF9A92; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,p{margin:0}
.disp{font-family:var(--f-display)}

[data-topic]{--tc:oklch(.5 .18 var(--h))}
[data-topic="all"]{--h:285}[data-topic="geo"]{--h:235}[data-topic="sport"]{--h:35}
[data-topic="culture"]{--h:350}[data-topic="science"]{--h:295}[data-topic="history"]{--h:70}
[data-topic="nature"]{--h:150}[data-topic="tech"]{--h:200}[data-topic="food"]{--h:20}

/* HOME */
#home{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:720px;margin:0 auto;padding-block:20px 36px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,10vw,54px);line-height:.95;letter-spacing:-.04em}
.brand b{color:var(--accent);font-weight:800}
.flags{display:flex;gap:8px;padding-top:4px}
.flag{width:36px;height:36px;border-radius:50%;padding:0;border:2px solid var(--line);background:var(--surface);overflow:hidden;display:block;opacity:.6;transition:transform .15s,opacity .15s}
.flag svg{width:100%;height:100%;display:block}
.flag[aria-pressed="true"]{opacity:1;border-color:var(--accent);transform:scale(1.12)}
.tag{color:var(--muted);max-width:30ch;font-size:17px}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.topic{position:relative;overflow:hidden;isolation:isolate;text-align:left;border:0;border-radius:22px;padding:16px;min-height:132px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:2px;background:var(--tc);color:#fff}
.topic::before,.topic::after{content:"";position:absolute;z-index:-1;border-radius:50%;background:#fff;opacity:.14}
.topic::before{width:120px;height:120px;right:-34px;top:-38px}
.topic::after{width:56px;height:56px;right:34px;top:62px;opacity:.1}
.topic b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.01em}
.topic i{font-style:normal;font-size:13px;opacity:.88;font-weight:600}
.topic:active{transform:scale(.97)}
.topic.wide{grid-column:1/-1;min-height:112px;background:linear-gradient(120deg,oklch(.5 .2 285),oklch(.55 .22 330) 55%,oklch(.62 .2 40));}
.topic.wide b{font-size:28px}

/* FEED */
#app{flex:1;min-height:0;display:none;flex-direction:column;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
#app.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.back{border:0;background:var(--surface);border-radius:999px;padding:10px 18px;min-height:44px;font-size:17px;font-weight:600;box-shadow:0 1px 0 var(--line)}
.bar .t{font-size:19px;font-family:var(--f-display);font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-variant-numeric:tabular-nums;font-weight:700;padding:10px 16px;min-height:44px;font-size:17px;border-radius:999px;background:var(--surface);min-width:72px;text-align:center}
#feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;isolation:isolate;
  display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px max(22px,env(safe-area-inset-right,0px)) 28px max(22px,env(safe-area-inset-left,0px))}
.card>*{width:100%;max-width:640px;margin-inline:auto}
.fact{background:var(--tc);color:#fff}
.fact::before,.fact::after{content:"";position:absolute;z-index:-1;border-radius:50%;background:#fff;opacity:.12}
.fact::before{width:min(80vw,420px);height:min(80vw,420px);right:-22vw;top:-12vh}
.fact::after{width:min(40vw,200px);height:min(40vw,200px);left:-14vw;bottom:8vh;opacity:.08}
.chip{align-self:flex-start;width:auto;margin-inline:max(0px,calc((100% - 640px)/2));display:inline-block;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.fact .text{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7.2vw,46px);line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.hint{position:absolute;left:0;right:0;bottom:16px;max-width:none!important;text-align:center;font-size:13px;font-weight:600;opacity:.9}
.hint::after{content:"\2193 ";display:block;font-size:20px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.q{background:var(--bg)}
.qk{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.q .text{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5.6vw,32px);line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0;margin:0;list-style:none}
.tile{position:relative;width:100%;aspect-ratio:1/1;min-height:140px;max-height:230px;border:0;border-radius:24px;padding:14px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .12s,box-shadow .12s,opacity .25s}
.tile:active:not([disabled]){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tile .l{position:absolute;left:14px;top:10px;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1;opacity:.85}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,6.6vw,32px);line-height:1.1;letter-spacing:-.01em;overflow-wrap:break-word;padding-top:8px}
.tile .v.long{font-size:clamp(17px,4.8vw,23px)}
.tile[data-k="0"]{background:var(--a);color:var(--on-a)}
.tile[data-k="1"]{background:var(--b);color:var(--on-b)}
.tile[data-k="2"]{background:var(--c);color:var(--on-c)}
.tile[data-k="3"]{background:var(--d);color:var(--on-d)}
.tile[disabled]{cursor:default}
.tile.dim{opacity:.35}
.tile.ok,.tile.no{opacity:1}
.tile.ok::after,.tile.no::after{content:"\2713 ";position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;

.tile.no::after{content:"\2717 ";color:#B3261E}
.res{min-height:26px;font-weight:700;text-align:center}
.res.ok{color:var(--good)}.res.no{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.hint::after{animation:none}.tile,.flag{transition:none}.topic:active{transform:none}}

.topic.stat{grid-column:1/-1;min-height:96px;background:var(--surface);color:var(--fg)}
.topic.stat::before,.topic.stat::after{background:var(--accent);opacity:.14}
.topic.stat i{color:var(--muted);opacity:1}
#stats{flex:1;min-height:0;display:none;flex-direction:column;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
#stats.on{display:flex}
.sbody{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:8px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.hero{display:flex;align-items:center;gap:20px;background:var(--surface);border-radius:26px;padding:20px;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.02em}
.hero .sub{min-width:0;flex:1 1 140px;display:flex;flex-direction:column;gap:4px}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:26px}
.hero p,.srow small{color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:12px}
.srow{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.srow .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.bar2{height:12px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:99px;background:var(--tc)}
.reset{align-self:center;border:2px solid var(--line);background:transparent;border-radius:12px;padding:10px 16px;font-weight:600;color:var(--muted)}
.reset.armed{border-color:var(--bad);color:var(--bad)}
</style><style>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildCountry(code,kind,lang){

function renderHome(){
  document.documentElement.lang=S.lang;
  $("tagline").textContent=T().tag;
  const f=$("flags");f.textContent="";
  LANGS.forEach(k=>{const b=el("button","flag");b.type="button";b.innerHTML=FLAGS[k];b.setAttribute("aria-label",LNAME[k]);b.title=LNAME[k];
    b.setAttribute("aria-pressed",k===S.lang);
    b.onclick=()=>{S.lang=k;try{localStorage.setItem("curiositapp.lang",k)}catch(e){}renderHome()};f.append(b)});
  const tp=$("topics");tp.textContent="";
  const mk=(k,name,sub,cls)=>{const b=el("button","topic "+(cls||""));b.type="button";b.dataset.topic=k;b.append(el("b",null,name),el("i",null,sub));b.onclick=()=>start(k);return b};
  tp.append(mk("all",T().all,T().allSub+" \u00b7 "+TOTAL,"wide"));
  const U=SU[S.lang],st=el("button","topic stat");st.type="button";st.append(el("b",null,U.title),el("i",null,pct(ST.c,ST.a)+"% \u00b7 "+U.answered+": "+ST.a));st.onclick=openStats;tp.append(st);
  TOPICS.forEach(k=>tp.append(mk(k,T().topics[k],IDS[k].length+" "+T().items)));
}

/* ---------- feed ---------- */
function setScore(){$("score").textContent=S.total?"\u2713 "+S.ok+"/"+S.total:"\u2713 0"}
function start(topic){
  S.topic=topic;S.decks={};S.last=null;S.ok=0;S.total=0;
  $("home").style.display="none";$("app").classList.add("on");
  $("back").textContent=T().back;$("ttl").textContent=topic==="all"?T().all:T().topics[topic];
  setScore();$("feed").textContent="";$("feed").scrollTop=0;
  fill(6);
}
$("back").onclick=()=>{saveSeen();$("app").classList.remove("on");$("home").style.display="";renderHome()};
function fill(n){for(let i=0;i<n;i++)addPair(draw())}
function addPair(it){
  const feed=$("feed");
  const f=el("article","card fact");f.dataset.topic=it.t;
  f.append(el("span","chip",T().topics[it.t]),el("p","text",it.fact),el("div","hint",T().swipe));
  const q=el("article","card q");
  q.append(el("div","qk",T().qk+" \u00b7 "+T().topics[it.t]),el("h2","text",it.question));
  const ul=el("ul","grid"),res=el("p","res");
  const order=shuffle([0,1,2,3]),btns=[];
  order.forEach((oi,pos)=>{
    const li=el("li"),b=el("button","tile");b.type="button";b.dataset.k=pos;
    const v=el("span","v",cap(it.options[oi]));if(it.options[oi].length>12)v.classList.add("long");b.append(el("span","l","ABCD"[pos]),v);
    b.onclick=()=>{
      const right=oi===it.answer,good=btns[order.indexOf(it.answer)];
      btns.forEach(x=>{x.disabled=true;x.classList.add("dim")});
      good.classList.remove("dim");good.classList.add("ok");
      if(!right){b.classList.remove("dim");b.classList.add("no")}
      S.total++;if(right)S.ok++;setScore();record(it.t,right);
      res.className="res "+(right?"ok":"no");
      res.textContent=right?T().ok:T().no+cap(it.options[it.answer]);
    };
    btns.push(b);li.append(b);ul.append(li);
  });
  q.append(ul,res);feed.append(f,q);
}
$("feed").addEventListener("scroll",()=>{const f=$("feed");if(f.scrollTop+f.clientHeight*5>=f.scrollHeight){fill(4);saveSeen()}},{passive:true});
renderHome();
</script>
